services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
      POSTGRES_DB: finrag
    ports:
      - "5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag"]
      interval: 2s
      retries: 30

volumes:
  datos:
